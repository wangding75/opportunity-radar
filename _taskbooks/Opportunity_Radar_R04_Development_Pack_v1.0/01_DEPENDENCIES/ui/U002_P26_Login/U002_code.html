<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Opportunity Radar R04 机会情报平台 - 登录</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary": "#4d556b",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-fixed": "#00174b",
                        "error": "#ba1a1a",
                        "surface-variant": "#e0e3e5",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#656d84",
                        "secondary-fixed": "#d3e4fe",
                        "primary-fixed": "#dbe1ff",
                        "surface": "#f7f9fb",
                        "primary": "#004ac6",
                        "on-background": "#191c1e",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#eef0ff",
                        "outline": "#737686",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "tertiary-fixed": "#dae2fd",
                        "on-surface": "#191c1e",
                        "primary-container": "#2563eb",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "on-secondary-container": "#54647a",
                        "surface-container": "#eceef0",
                        "secondary-fixed-dim": "#b7c8e1",
                        "secondary": "#505f76",
                        "surface-dim": "#d8dadc",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "surface-bright": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed-dim": "#bec6e0",
                        "background": "#f7f9fb",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-tint": "#0053db",
                        "on-secondary-fixed": "#0b1c30",
                        "inverse-on-surface": "#eff1f3",
                        "outline-variant": "#c3c6d7",
                        "surface-container-low": "#f2f4f6",
                        "on-surface-variant": "#434655",
                        "secondary-container": "#d0e1fb",
                        "on-tertiary-fixed": "#131b2e",
                        "surface-container-high": "#e6e8ea"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "PingFang SC", "Microsoft YaHei", "sans-serif"],
                        "display": ["Inter", "PingFang SC", "Microsoft YaHei", "sans-serif"],
                        "body": ["Inter", "PingFang SC", "Microsoft YaHei", "sans-serif"],
                        "label": ["Inter", "PingFang SC", "Microsoft YaHei", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[400px]">
<!-- Main Login Panel -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-8">
<div class="text-center mb-8">
<h1 class="text-xl font-headline font-bold text-on-surface mb-1">Opportunity Radar</h1>
<p class="text-sm font-body text-on-surface-variant">R04 机会情报平台</p>
</div>
<div class="mb-6">
<h2 class="text-lg font-headline font-semibold text-on-surface mb-1">登录</h2>
<p class="text-sm font-body text-on-surface-variant">使用平台账户继续访问机会情报工作区</p>
</div>
<form class="space-y-4">
<div>
<label class="block text-sm font-medium text-on-surface mb-1" for="username">邮箱或用户名</label>
<input class="w-full px-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container text-sm" id="username" placeholder="请输入邮箱或用户名" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-on-surface mb-1" for="password">密码</label>
<div class="relative">
<input class="w-full px-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container text-sm pr-10" id="password" placeholder="请输入密码" type="password"/>
<button class="absolute inset-y-0 right-0 px-3 flex items-center text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-end">
<a class="text-sm font-medium text-primary hover:text-on-primary-fixed-variant" href="#">忘记密码？</a>
</div>
<button class="w-full bg-primary text-on-primary font-medium py-2 rounded transition-colors hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" type="submit">
                    登录
                </button>
</form>
</div>
<!-- State Specimens (For Documentation/Development purposes, rendered below main panel) -->
<div class="mt-8 border-t border-outline-variant pt-6">
<h3 class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-4">State Specimens</h3>
<div class="space-y-3">
<!-- Validation Error -->
<div class="p-3 bg-surface-container-lowest border border-error rounded flex items-start gap-2">
<span class="material-symbols-outlined text-error text-[18px]" data-icon="error">error</span>
<div>
<p class="text-sm text-error font-medium">Field validation error</p>
<p class="text-xs text-on-surface-variant">请输入邮箱或用户名</p>
</div>
</div>
<!-- Auth Failure -->
<div class="p-3 bg-error-container border border-error rounded flex items-start gap-2">
<span class="material-symbols-outlined text-on-error-container text-[18px]" data-icon="warning">warning</span>
<div>
<p class="text-sm text-on-error-container font-medium">Authentication failure</p>
<p class="text-xs text-on-error-container opacity-80">账户或密码不正确</p>
</div>
</div>
<!-- Rate Limit -->
<div class="p-3 bg-surface-container-highest border border-outline-variant rounded flex items-start gap-2">
<span class="material-symbols-outlined text-on-surface text-[18px]" data-icon="hourglass_empty">hourglass_empty</span>
<div>
<p class="text-sm text-on-surface font-medium">Rate limit</p>
<p class="text-xs text-on-surface-variant">尝试次数过多，请稍后再试</p>
</div>
</div>
<!-- Service Unavailable -->
<div class="p-3 bg-surface-container-highest border border-outline-variant rounded flex items-start gap-2">
<span class="material-symbols-outlined text-on-surface text-[18px]" data-icon="cloud_off">cloud_off</span>
<div>
<p class="text-sm text-on-surface font-medium">Service unavailable</p>
<p class="text-xs text-on-surface-variant">认证服务暂时不可用</p>
</div>
</div>
</div>
</div>
</div>
</body></html>
