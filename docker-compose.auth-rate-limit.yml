services:
  postgres-auth-rate-limit:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opportunity_radar_auth_rate_limit
      POSTGRES_USER: opportunity_radar
      POSTGRES_PASSWORD: runtime-test-postgres-password-012345
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity_radar -d opportunity_radar_auth_rate_limit"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - opportunity_radar_auth_rate_limit_pgdata:/var/lib/postgresql/data

  auth-rate-limit-runner:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      APP_ENV: test
      AUTH_MODE: rbac
      DATABASE_URL: postgresql+psycopg://opportunity_radar:runtime-test-postgres-password-012345@postgres-auth-rate-limit:5432/opportunity_radar_auth_rate_limit
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "30"
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "4"
      LOGIN_RATE_LIMIT_BLOCK_SECONDS: "20"
      PYTHONPATH: /workspace/backend
    command: ["python", "scripts/validate_auth_rate_limit_postgres.py"]
    depends_on:
      postgres-auth-rate-limit:
        condition: service_healthy

volumes:
  opportunity_radar_auth_rate_limit_pgdata:
